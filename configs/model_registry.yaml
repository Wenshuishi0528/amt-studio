  game:
    role: singing_voice_amt
    status: candidate_not_yet_verified_in_project
    environment: workers/game
    upstream: https://github.com/openvpi/GAME
    cli_hint: python infer.py extract AUDIO -m MODEL --output-formats mid,txt,csv
    license:
      code: verify_at_pinned_commit
      weights: verify_per_weight
    pin:
      git_commit: null
      weight_id: null
      weight_sha256: null

  basic_pitch:
    role: general_single_source_amt
    status: candidate_not_yet_verified_in_project
    environment: workers/basic_pitch
    upstream: https://github.com/spotify/basic-pitch
    install_hint: pip install basic-pitch
    cli_hint: basic-pitch OUTPUT_DIR AUDIO --save-model-outputs --save-note-events
    license:
      code: Apache-2.0 according to upstream
      weights: verify_bundled_model_terms_at_pinned_version
    pin:
      package_version: null
      model_serialization: coreml
      weight_sha256: null

  separator:
    role: source_separation
    status: verified_hyak_benchmark_user_selected
    environment: workers/separator
    upstream: https://github.com/nomadkaraoke/python-audio-separator
    install_hint_hyak: uv sync --project workers/separator --locked
    cli_hint: audio-separator AUDIO --model_filename MODEL
    selection:
      status: confirmed_by_project_owner
      default_preset: vocal_quality_a
      fallback_preset: multistem_quality_a
      basis:
        - candidate A was preferred on all three reviewed passages
        - candidate A vocals were reported as clear
        - candidate B had obvious accompaniment leakage and audible echo
        - candidate B remains useful when separate drums, bass, and residual stems are required
      limitation: one-song listening preference is not transcription accuracy evidence
    runtime:
      torch: 2.7.1
      ffmpeg_module: weirdlab/ffmpeg/8.1
      inference: hyak_slurm_cuda_only
      mac_role: orchestration_validation_and_listening_review
    license:
      wrapper_code: MIT at pinned upstream commit
      model_weights: private_research_only_pending_independent_rights_review
    pin:
