schema_version: 1
models:
  muscriptor:
    role: direct_multi_instrument_amt
    status: verified_hyak_full_mix_baseline
    environment: workers/muscriptor
    upstream: https://github.com/muscriptor/muscriptor
    install_hint: uv sync --project workers/muscriptor --locked
    cli_hint: muscriptor transcribe AUDIO --model large --format jsonl -o EVENTS
    runtime:
      torch: 2.2.2
      inference: hyak_slurm_cuda_only
      mac_role: orchestration_validation_and_result_rendering
    license:
      code: MIT at pinned upstream tag
      weights: CC-BY-NC-4.0 plus gated repository-specific conditions
    pin:
      package_version: 0.2.2
      git_commit: 3feb2497bcd5316f9a9934b93d9f5dd3ff15e85a
      pypi_wheel_sha256: 911f41057b8f9608839cc0b6c49f08df075ae7bc29df97428eb4febe0272fa94
      weight_id: MuScriptor/muscriptor-large
      weight_revision: 8809fdfbed2affa7ade94a7059e746e3880720e7
      weight_sha256: ac4eb6ea87dfc26b6ca6b954c6b967ab87ad4c7d08e078b25214f13ed051f397

  game:
    role: singing_voice_amt
    status: candidate_not_yet_verified_in_project
    environment: workers/game
    upstream: https://github.com/openvpi/GAME
    cli_hint: python infer.py extract AUDIO -m MODEL --output-formats mid,txt,csv
    license:
      code: verify_at_pinned_commit
      weights: verify_per_weight
    pin:
      git_commit: null
      weight_id: null
      weight_sha256: null

  basic_pitch:
    role: general_single_source_amt
    status: candidate_not_yet_verified_in_project
    environment: workers/basic_pitch
    upstream: https://github.com/spotify/basic-pitch
    install_hint: pip install basic-pitch
    cli_hint: basic-pitch OUTPUT_DIR AUDIO --save-model-outputs --save-note-events
    license:
      code: Apache-2.0 according to upstream
      weights: verify_bundled_model_terms_at_pinned_version
    pin:
      package_version: null
      model_serialization: coreml
      weight_sha256: null

  separator:
    role: source_separation
    status: candidate_models_must_be_benchmarked
    environment: workers/separator
    upstream: https://github.com/nomadkaraoke/python-audio-separator
    install_hint_mac: pip install "audio-separator[cpu]"
    cli_hint: audio-separator AUDIO --model_filename MODEL
    license:
      wrapper_code: verify_at_pinned_version
      model_weights: verify_each_model_separately
    pin:
      package_version: null
      model_ids: []
      model_sha256: {}

  beat_this:
    role: beat_downbeat
    status: candidate_not_yet_verified_in_project
    environment: workers/beat_this
    upstream: https://github.com/CPJKU/beat_this
    install_hint: pip install beat-this
    cli_hint: beat_this AUDIO -o OUTPUT
    license:
      code_and_released_weights: verify_at_pinned_version
    pin:
      package_version: null
      checkpoint: final0
      weight_sha256: null
