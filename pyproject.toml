[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amt-studio-core"
version = "0.1.0"
description = "Dependency-light orchestration core for a local-first automatic music transcription system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Project owner" }]
dependencies = []

[dependency-groups]
dev = [
    "mido==1.3.3",
]

[project.scripts]
amt = "amt_core.cli:main"
amt-private-beta = "amt_core.private_beta:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amt_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []
