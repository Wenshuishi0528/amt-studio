[project]
name = "amt-basic-pitch-worker"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "basic-pitch[onnx]==0.4.0",
    "numpy==1.26.4",
    "onnxruntime==1.23.2",
    # resampy 0.4.3 still imports pkg_resources at module import time.
    # Setuptools 81 removes that compatibility module.
    "setuptools==80.9.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
