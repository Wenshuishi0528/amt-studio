[project]
name = "amt-game-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click==8.3.1",
    "colorednoise==2.2.0",
    "einops==0.8.1",
    "h5py==3.16.0",
    "librosa==0.11.0",
    "lightning==2.6.1",
    "loguru==0.7.3",
    "matplotlib==3.11.1",
    "mido==1.3.3",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "pydantic==2.12.5",
    "resampy==0.4.3",
    "scipy==1.16.3",
    "torch==2.8.0",
    "torchmetrics==1.8.2",
    "tqdm==4.67.1",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
